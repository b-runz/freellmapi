apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi
  labels: { app: freellmapi }
spec:
  replicas: 1
  strategy:
    type: Recreate        # SQLite on a single PVC: never run two at once
  selector:
    matchLabels: { app: freellmapi }
  template:
    metadata:
      labels: { app: freellmapi }
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullSecretName }}
      containers:
        - name: freellmapi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ENCRYPTION_KEY }
          readinessProbe:
            httpGet: { path: /api/ping, port: 3001 }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/server/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freellmapi-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freellmapi-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: freellmapi
spec:
  selector: { app: freellmapi }
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freellmapi
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host | quote }}]
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freellmapi
                port: { number: 3001 }
